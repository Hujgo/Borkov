services:
  reddit-rss:
    # built by .github/workflows/docker.yml; replace OWNER with your GitHub username (lowercase)
    image: ghcr.io/OWNER/reddit-rss:latest
    container_name: reddit-rss
    restart: unless-stopped
    env_file: .env
    read_only: true
    # internal only; remove "ports" entirely if your reader shares a docker network with it
    ports:
      - "80:80"
